version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-common-grid-strider-v28
  timeout: {exec_timeout: 36h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: strider-group
      tasks:
        - name: strider
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                V26=/mnt/amlfs-07/shared/linke/speedtuning-act-common-grid-rl-v26/runs/d890628868666d148b14fc2fa2a55b7d968f6b62
                V27=/mnt/amlfs-07/shared/linke/speedtuning-act-common-grid-strider-v27/runs/ac2e5308fcab7ebfe2555cc95163ff2e09f1124a/tasks
                INPUT=/mnt/amlfs-07/shared/linke/speedtuning-act-controller-retrain-v20/inputs
                RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-common-grid-strider-v28/runs/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-common-grid-strider-v28
                OUTPUT=/osmo/data/output/strider
                DETECTOR=$INPUT/detector
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$V26/COMPLETE.json"
                test -f "$V26/RUN_MANIFEST.json"
                test -f "$V27/COMPLETE.json"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q tests/test_act_common_grid_strider_v27.py tests/test_act_common_grid_strider_v28.py
                mkdir -p "$RUN/panels" "$OUTPUT"
                for TASK in pick tea insertion; do
                  .venv/bin/python scripts/build_common_grid_strider_panel_v28.py \
                    --task-label "$TASK" --output "$RUN/panels/$TASK.json"
                done
                for TASK in pick tea insertion; do
                  .venv/bin/python scripts/run_act_common_grid_strider_v27.py \
                    --root "$RUN/tasks" --source-commit "$SOURCE_COMMIT" \
                    --v26-root "$V26" --v27-root "$V27" --task-label "$TASK" \
                    --panel "$RUN/panels/$TASK.json" --study-version v28 \
                    --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                    --detector-source "$DETECTOR/source" --device cuda
                done
                .venv/bin/python scripts/finalize_act_common_grid_strider_v27.py \
                  --root "$RUN/tasks" --study-version v28
                test -f "$RUN/tasks/COMPLETE.json"
                cp "$RUN/tasks/RESULT.json" "$RUN/tasks/COMPLETE.json" "$OUTPUT/"
                find "$RUN" -name COMPLETE.json -o -name RESULT.json -o -name SELECTION.json | sort | xargs sha256sum > "$OUTPUT/SHA256SUMS"
                echo ACT_COMMON_GRID_STRIDER_V28_COMPLETE source=$SOURCE_COMMIT
