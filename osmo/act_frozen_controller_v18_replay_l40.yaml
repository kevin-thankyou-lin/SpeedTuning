version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-frozen-controller-v18-replay-v19
  timeout: {exec_timeout: 48h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: replay-group
      tasks:
        - name: replay
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                DETECTOR=$BENCHMARK/frozen_detector
                RUN=/mnt/amlfs-04/home/linke/speedtuning-act-frozen-controller-v18-replay-v19/runs/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-frozen-controller-v18-replay
                OUTPUT=/osmo/run/outputs/replay
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$BENCHMARK/contract.json"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q \
                  tests/test_run_act_frozen_controller_v18_replay.py \
                  tests/test_act_speed_benchmark_runner.py \
                  tests/test_act_speed_benchmark_receipts.py \
                  tests/test_run_act_strider_representative_final_v18.py
                mkdir -p "$RUN" "$OUTPUT"
                for TASK in pick tea insertion; do
                  for METHOD in learned_phase_subtask learned_phase_tabular_rl learned_phase_rainbow_rl; do
                    .venv/bin/python scripts/run_act_frozen_controller_v18_replay.py \
                      --root "$RUN" --source-commit "$SOURCE_COMMIT" \
                      --benchmark-root "$BENCHMARK" \
                      --banks experiments/act_strider_representative_final_v18/BANKS.json \
                      --contract experiments/act_strider_frozen_controller_replay_v19/CONTRACT.md \
                      --task-label "$TASK" --method "$METHOD" \
                      --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                      --detector-source "$DETECTOR/source" --device cuda \
                      2>&1 | tee -a "$OUTPUT/run.log"
                  done
                done
                find "$RUN" -name COMPLETE.json -o -name RESULT.json | sort | xargs sha256sum > "$OUTPUT/SHA256SUMS"
                test "$(find "$RUN" -name COMPLETE.json | wc -l)" -eq 9
                echo FROZEN_CONTROLLER_V18_REPLAY_COMPLETE source=$SOURCE_COMMIT
