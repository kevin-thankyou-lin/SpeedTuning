version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-rl-zero-init-eval-v25
  timeout: {exec_timeout: 24h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: evaluate-group
      tasks:
        - name: evaluate
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                V20=/mnt/amlfs-07/shared/linke/speedtuning-act-controller-retrain-v20
                V22_RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-controller-budget25-eval-v22/runs/d1bcd85c78e306343a173bc18af6773879039915
                V23_RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-tabular-budget20-eval-v23/runs/315a33143d83e65964980867a5bc341c6fc2dc98
                V24_RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-strider-v22-bank-replay-v24/runs/9904705c733124d17c2e0f5c12718377b8893a23
                INPUT=$V20/inputs
                RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-rl-zero-init-eval-v25/runs/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-rl-zero-init-eval-v25
                OUTPUT=/osmo/data/output/evaluate
                CONTRACT=experiments/act_rl_zero_init_eval_v25/contract.json
                DETECTOR=$INPUT/detector
                MANIFEST=$RUN/RUN_MANIFEST.json
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$V22_RUN/COMPLETE.json"
                test -f "$V23_RUN/COMPLETE.json"
                test -f "$V24_RUN/COMPLETE.json"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q tests/test_act_rl_zero_init_v25.py tests/test_act_controller_budget25_v22.py tests/test_act_speed_benchmark_runner.py
                mkdir -p "$RUN" "$OUTPUT"
                .venv/bin/python scripts/create_act_rl_zero_init_v25_manifest.py \
                  --contract "$CONTRACT" --source-commit "$SOURCE_COMMIT" \
                  --v22-root "$V22_RUN" --v23-root "$V23_RUN" --v24-root "$V24_RUN" --output "$MANIFEST"
                .venv/bin/python scripts/freeze_act_rl_zero_init_v25.py \
                  --run-manifest "$MANIFEST" --v22-root "$V22_RUN" --output-root "$RUN/frozen"
                test -f "$RUN/frozen/FROZEN_CONTROLLERS_COMPLETE.json"
                for TASK in pick tea insertion; do
                  for METHOD in learned_phase_tabular_rl learned_phase_rainbow_rl; do
                    .venv/bin/python scripts/run_act_speed_benchmark_cell.py \
                      --contract "$CONTRACT" --run-manifest "$MANIFEST" \
                      --task-label "$TASK" --method "$METHOD" --stage final \
                      --source-commit "$SOURCE_COMMIT" --output-root "$RUN/final/$TASK/$METHOD" \
                      --search-root "$RUN/frozen/$TASK/$METHOD" \
                      --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                      --detector-source "$DETECTOR/source" --device cuda
                  done
                done
                .venv/bin/python scripts/finalize_act_rl_zero_init_v25.py \
                  --run-manifest "$MANIFEST" --root "$RUN" --v22-root "$V22_RUN" --v23-root "$V23_RUN" --v24-root "$V24_RUN"
                test -f "$RUN/COMPLETE.json"
                cp "$MANIFEST" "$RUN/RESULT.json" "$RUN/COMPLETE.json" "$RUN/frozen/FROZEN_CONTROLLERS_COMPLETE.json" "$OUTPUT/"
                find "$RUN" -name COMPLETE.json -o -name result.json -o -name selected.json | sort | xargs sha256sum > "$OUTPUT/SHA256SUMS"
                echo ACT_RL_ZERO_INIT_EVAL_V25_COMPLETE source=$SOURCE_COMMIT
