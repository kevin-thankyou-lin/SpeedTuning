version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-sail-prior-stage-v33
  timeout: {exec_timeout: 2h, queue_timeout: 2h}
  resources:
    default: {cpu: 2, gpu: 0, memory: 8Gi, platform: cpu, storage: 8Gi}
  groups:
    - name: prior-stage-group
      tasks:
        - name: prior-stage
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                CODE=/osmo/run/workspace/SpeedTuning-act-sail-prior-stage-v33
                OUTPUT=/osmo/data/output/priors
                export SPEEDTUNING_SPEED_VALUES=1,1.5,2,2.5,3
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra imitation --extra test
                mkdir -p "$OUTPUT"
                .venv/bin/python scripts/build_act_sail_priors_v33.py --output "$OUTPUT/OFFLINE_PRIORS.json"
                sha256sum "$OUTPUT/OFFLINE_PRIORS.json" > "$OUTPUT/SHA256SUMS"
                echo ACT_SAIL_PRIOR_STAGE_V33_COMPLETE source=$SOURCE_COMMIT
