version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-sail-warmstart-v33
  timeout: {exec_timeout: 12h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 64Gi}
  groups:
    - name: sail-warmstart-group
      tasks:
        - name: sail-warmstart
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                V26=/mnt/amlfs-07/shared/linke/speedtuning-act-common-grid-rl-v26/runs/d890628868666d148b14fc2fa2a55b7d968f6b62
                V32=/mnt/amlfs-07/shared/linke/speedtuning-act-common-grid-strider-causal25-v32/runs/766d174917959f577c7cb956b3e6f2dc61010b30
                INPUT=/mnt/amlfs-07/shared/linke/speedtuning-act-controller-retrain-v20/inputs
                RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-sail-warmstart-v33/runs/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-sail-warmstart-v33
                OUTPUT=/osmo/data/output/sail-warmstart
                CONTRACT=experiments/act_sail_warmstart_v33/CONTRACT.md
                BANKS=experiments/act_sail_warmstart_v33/BANKS.json
                PRIORS=experiments/act_sail_warmstart_v33/OFFLINE_PRIORS.json
                V32_BANKS=experiments/act_common_grid_strider_causal25_v32/BANKS.json
                DETECTOR=$INPUT/detector
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export SPEEDTUNING_SPEED_VALUES=1,1.5,2,2.5,3
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$V26/COMPLETE.json"
                test -f "$V26/RUN_MANIFEST.json"
                test -f "$V32/COMPLETE.json"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q tests/test_act_sail_warmstart_v33.py tests/test_act_common_grid_strider_causal25_v32.py
                test -f "$PRIORS"
                mkdir -p "$RUN" "$OUTPUT"
                for TASK in pick tea insertion; do
                  for METHOD in sail_causal sail_tabular agent_causal; do
                    .venv/bin/python scripts/run_act_sail_warmstart_v33.py \
                      --stage search --method "$METHOD" --root "$RUN" --v32-root "$V32" \
                      --source-commit "$SOURCE_COMMIT" --run-manifest "$V26/RUN_MANIFEST.json" \
                      --task-label "$TASK" --contract "$CONTRACT" --banks "$BANKS" \
                      --v32-banks "$V32_BANKS" --offline-priors "$PRIORS" \
                      --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                      --detector-source "$DETECTOR/source" --device cuda
                  done
                done
                for TASK in pick tea insertion; do
                  for METHOD in native_1x strider_v32 sail_causal sail_tabular agent_causal; do
                    .venv/bin/python scripts/run_act_sail_warmstart_v33.py \
                      --stage final --method "$METHOD" --root "$RUN" --v32-root "$V32" \
                      --source-commit "$SOURCE_COMMIT" --run-manifest "$V26/RUN_MANIFEST.json" \
                      --task-label "$TASK" --contract "$CONTRACT" --banks "$BANKS" \
                      --v32-banks "$V32_BANKS" --offline-priors "$PRIORS" \
                      --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                      --detector-source "$DETECTOR/source" --device cuda
                  done
                done
                .venv/bin/python scripts/finalize_act_sail_warmstart_v33.py \
                  --root "$RUN" --v32-banks "$V32_BANKS" --offline-priors "$PRIORS"
                cp "$RUN/RESULT.json" "$RUN/COMPLETE.json" "$OUTPUT/"
                find "$RUN" -name SEARCH_COMPLETE.json -o -name SELECTION.json -o -name IDENTITY.json -o -name COMPLETE.json -o -name RESULT.json | sort | xargs sha256sum > "$OUTPUT/SHA256SUMS"
                echo ACT_SAIL_WARMSTART_V33_COMPLETE source=$SOURCE_COMMIT
