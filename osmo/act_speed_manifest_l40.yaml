version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-speed-manifest-20260824-v2
  timeout:
    exec_timeout: 2h
    queue_timeout: 4h
  resources:
    default:
      cpu: 4
      gpu: 0
      memory: 16Gi
      platform: ovx-l40
      storage: 8Gi
  groups:
    - name: manifest-group
      tasks:
        - name: manifest
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                ATTEMPT=$BENCHMARK/attempts/$SOURCE_COMMIT
                DETECTOR=$BENCHMARK/frozen_detector
                CODE=/osmo/run/workspace/SpeedTuning-act-speed-manifest
                OUTPUT=/osmo/run/outputs

                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                test -f "$DETECTOR/source/phase_detector/rgb_inference.py"
                test -f "$DETECTOR/source/phase_detector/rgb_proprio.py"
                mkdir -p "$ATTEMPT" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q tests/test_original_act_speed_adapter.py
                .venv/bin/python scripts/create_act_speed_manifest.py \
                  --contract experiments/act_speed_benchmark_v1/contract.json \
                  --source-commit "$SOURCE_COMMIT" \
                  --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                  --detector-source "$DETECTOR/source" \
                  --output "$ATTEMPT/run_manifest.json" \
                  2>&1 | tee "$OUTPUT/manifest.log"
                cp "$ATTEMPT/run_manifest.json" "$OUTPUT/"
                sha256sum "$ATTEMPT/run_manifest.json" | tee "$OUTPUT/run_manifest.sha256"
                echo ACT_SPEED_MANIFEST_COMPLETE
