version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-speed-methods-smoke-20260824-v1
  timeout: {exec_timeout: 4h, queue_timeout: 4h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 32Gi}
  groups:
    - name: smoke-group
      tasks:
        - name: smoke
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                ATTEMPT=$BENCHMARK/attempts/$SOURCE_COMMIT
                DETECTOR=$BENCHMARK/frozen_detector
                RUN=$BENCHMARK/engineering/method-smoke/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-speed-method-smoke
                OUTPUT=/osmo/run/outputs/smoke
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test -f "$ATTEMPT/run_manifest.json"
                mkdir -p "$RUN" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q tests/test_act_speed_methods.py tests/test_act_speed_benchmark_runner.py
                .venv/bin/python scripts/smoke_act_speed_benchmark.py \
                  --contract experiments/act_speed_benchmark_v1/contract.json \
                  --run-manifest "$ATTEMPT/run_manifest.json" --source-commit "$SOURCE_COMMIT" \
                  --task-label pick --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                  --detector-source "$DETECTOR/source" --output "$RUN/receipt.json" --device cuda \
                  2>&1 | tee "$OUTPUT/run.log"
                cp "$RUN/receipt.json" "$OUTPUT/"
                echo ACT_SPEED_METHOD_SMOKE_COMPLETE source=$SOURCE_COMMIT
