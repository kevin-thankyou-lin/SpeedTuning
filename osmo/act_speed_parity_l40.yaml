version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
  task_label: pick
workflow:
  name: speedtuning-act-speed-parity-{{ task_label }}-20260824-v4
  timeout:
    exec_timeout: 12h
    queue_timeout: 4h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 32Gi
  groups:
    - name: parity-{{ task_label }}-group
      tasks:
        - name: parity-{{ task_label }}
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
            TASK_LABEL: "{{ task_label }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                ATTEMPT=$BENCHMARK/attempts/$SOURCE_COMMIT
                RUN=$ATTEMPT/parity/$TASK_LABEL
                CODE=/osmo/run/workspace/SpeedTuning-act-speed-parity-$TASK_LABEL
                OUTPUT=/osmo/run/outputs/$TASK_LABEL

                export MUJOCO_GL=egl
                export PYOPENGL_PLATFORM=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                export TOKENIZERS_PARALLELISM=false

                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$ATTEMPT/run_manifest.json"
                mkdir -p "$RUN" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q \
                  tests/test_original_act_speed_adapter.py \
                  tests/test_speed_infrastructure.py \
                  2>&1 | tee "$OUTPUT/pytest.log"
                .venv/bin/python scripts/run_act_speed_parity.py \
                  --contract experiments/act_speed_benchmark_v1/contract.json \
                  --run-manifest "$ATTEMPT/run_manifest.json" \
                  --task-label "$TASK_LABEL" --source-commit "$SOURCE_COMMIT" \
                  --output-root "$RUN" --device cuda \
                  2>&1 | tee "$OUTPUT/parity.log"
                cp "$RUN/identity.json" "$RUN/progress.json" "$RUN/result.json" \
                  "$RUN/COMPLETE.json" "$OUTPUT/"
                echo ACT_SPEED_PARITY_COMPLETE task=$TASK_LABEL source=$SOURCE_COMMIT
