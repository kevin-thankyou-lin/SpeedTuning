version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
  task_label: REQUIRED_TASK
  method: REQUIRED_METHOD
workflow:
  name: speedtuning-act-speed-search-{{ task_label }}-{{ method }}-20260824-v1
  timeout: {exec_timeout: 24h, queue_timeout: 4h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: search-group
      tasks:
        - name: search
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
            TASK_LABEL: "{{ task_label }}"
            METHOD: "{{ method }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                ATTEMPT=$BENCHMARK/attempts/$SOURCE_COMMIT
                RUN=$BENCHMARK/runs/$SOURCE_COMMIT/$TASK_LABEL/$METHOD/search
                CODE=/osmo/run/workspace/SpeedTuning-act-speed-search-$TASK_LABEL-$METHOD
                OUTPUT=/osmo/run/outputs/search
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                case "$METHOD" in uniform_sweep|awe_offline_proxy|sail_inspired_adaptive) ;; *) exit 64;; esac
                test -f "$ATTEMPT/run_manifest.json"
                mkdir -p "$RUN" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra rl --extra test
                .venv/bin/python -m pytest -q tests/test_act_speed_methods.py tests/test_original_act_speed_adapter.py
                .venv/bin/python scripts/run_act_speed_benchmark_cell.py \
                  --contract experiments/act_speed_benchmark_v1/contract.json \
                  --run-manifest "$ATTEMPT/run_manifest.json" --source-commit "$SOURCE_COMMIT" \
                  --task-label "$TASK_LABEL" --method "$METHOD" --stage search \
                  --output-root "$RUN" --device cuda 2>&1 | tee "$OUTPUT/run.log"
                cp "$RUN/identity.json" "$RUN/preregistration.json" "$RUN/progress.json" \
                  "$RUN/selected.json" "$RUN/result.json" "$RUN/COMPLETE.json" "$OUTPUT/"
                echo ACT_SPEED_SEARCH_COMPLETE task=$TASK_LABEL method=$METHOD source=$SOURCE_COMMIT

