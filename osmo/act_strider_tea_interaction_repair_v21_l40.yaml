version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-strider-tea-interaction-repair-v21
  timeout: {exec_timeout: 12h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: repair-group
      tasks:
        - name: repair
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment: {SOURCE_COMMIT: "{{ source_commit }}"}
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                V20=/mnt/amlfs-07/shared/linke/speedtuning-act-controller-retrain-v20
                INPUT=$V20/inputs
                MANIFEST=$V20/runs/9aa797796ba5dfee7db2a7a4dab73183c04585bd/RUN_MANIFEST.json
                RUN=/mnt/amlfs-07/shared/linke/speedtuning-act-strider-tea-repair-v21/runs/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-strider-tea-repair-v21
                OUTPUT=/osmo/data/output/repair
                CONTRACT=experiments/act_strider_tea_interaction_repair_v21/CONTRACT.md
                CRITERION=experiments/act_strider_tea_interaction_repair_v21/SUCCESS_CRITERION.json
                DETECTOR=$INPUT/detector
                PANEL=$RUN/PANEL.json
                ROOT=$RUN/tea
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$MANIFEST"
                test -f "$INPUT/tasks/tea-act-artifacts/checkpoints/policy_best.ckpt"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q \
                  tests/test_act_strider_tea_interaction_repair_v21.py \
                  tests/test_run_act_strider_representative_confirmation_v17.py \
                  tests/test_build_representative_reset_panel.py
                mkdir -p "$RUN" "$OUTPUT"
                .venv/bin/python scripts/build_tea_representative_repair_panel_v21.py --output "$PANEL"
                .venv/bin/python scripts/run_act_strider_tea_interaction_repair_v21.py \
                  --root "$ROOT" --source-commit "$SOURCE_COMMIT" \
                  --run-manifest "$MANIFEST" --contract "$CONTRACT" --panel "$PANEL" \
                  --success-criterion "$CRITERION" \
                  --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                  --detector-source "$DETECTOR/source" --device cuda
                test -f "$ROOT/COMPLETE.json"
                cp "$PANEL" "$ROOT/IDENTITY.json" "$ROOT/SELECTION.json" "$ROOT/COMPLETE.json" "$OUTPUT/"
                sha256sum "$OUTPUT"/*.json > "$OUTPUT/SHA256SUMS"
                echo ACT_STRIDER_TEA_INTERACTION_REPAIR_V21_COMPLETE source=$SOURCE_COMMIT
