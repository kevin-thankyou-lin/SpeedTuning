version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-strider-tea-volume-20260825-v5
  timeout: {exec_timeout: 24h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: strider-tea-volume-group
      tasks:
        - name: frontier
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                BASE_SOURCE=866c9f436caf0a73e5e08ef83be38cbe89a23a61
                MANIFEST=$BENCHMARK/attempts/$BASE_SOURCE/run_manifest.json
                DETECTOR=$BENCHMARK/frozen_detector
                RUN=/mnt/amlfs-04/home/linke/speedtuning-act-strider-tea-volume-v5/runs/$SOURCE_COMMIT/tea
                CODE=/osmo/run/workspace/SpeedTuning-act-strider-tea-volume-v5
                OUTPUT=/osmo/run/outputs/tea
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$MANIFEST"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                test ! -e "$RUN"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q \
                  tests/test_tea_success_volume.py \
                  tests/test_run_act_strider_tea_volume_v5.py \
                  tests/test_run_act_strider_frontier_v4.py \
                  tests/test_act_vlm_frontier_server.py \
                  tests/test_original_act_speed_adapter.py
                mkdir -p "$RUN" "$OUTPUT"
                SEARCH_SEEDS=$(seq -s, 160501100 160501119)
                FINAL_SEEDS=$(seq -s, 20131100 20131149)
                .venv/bin/python scripts/run_act_strider_tea_volume_v5.py \
                  --root "$RUN" --source-commit "$SOURCE_COMMIT" \
                  --run-manifest "$MANIFEST" \
                  --contract experiments/act_strider_tea_volume_v5/CONTRACT.md \
                  --banks experiments/act_strider_tea_volume_v5/BANKS.json \
                  --success-criterion experiments/act_strider_tea_volume_v5/SUCCESS_CRITERION.json \
                  --search-seeds "$SEARCH_SEEDS" --final-seeds "$FINAL_SEEDS" \
                  --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                  --detector-source "$DETECTOR/source" --device cuda \
                  2>&1 | tee "$OUTPUT/run.log"
                cp "$RUN/IDENTITY.json" "$RUN/SELECTION.json" \
                  "$RUN/RESULT.json" "$RUN/COMPLETE.json" "$OUTPUT/"
                cp "$RUN/metric_regression/RECEIPT.json" \
                  "$RUN/metric_regression/"*.mp4 "$OUTPUT/"
                sha256sum "$RUN/IDENTITY.json" "$RUN/SELECTION.json" \
                  "$RUN/RESULT.json" "$RUN/COMPLETE.json"
                echo STRIDER_TEA_VOLUME_V5_COMPLETE source=$SOURCE_COMMIT
