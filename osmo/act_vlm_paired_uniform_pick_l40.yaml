version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-vlm-paired-uniform-pick-20260824-v1
  timeout: {exec_timeout: 12h, queue_timeout: 12h}
  resources:
    default: {cpu: 12, gpu: 1, memory: 64Gi, platform: ovx-l40, storage: 48Gi}
  groups:
    - name: paired-uniform-group
      tasks:
        - name: paired-uniform
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                BENCHMARK=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1
                BASE_SOURCE=866c9f436caf0a73e5e08ef83be38cbe89a23a61
                MANIFEST=$BENCHMARK/attempts/$BASE_SOURCE/run_manifest.json
                DETECTOR=$BENCHMARK/frozen_detector
                TARGETED=/mnt/amlfs-04/home/linke/speedtuning-act-vlm-targeted-pick-screen-v1/runs/cda7f3e0c85a7efc420cbc34e565a368561ae607/pick
                BALANCED=/mnt/amlfs-04/home/linke/speedtuning-act-vlm-balanced35-extension-v1/runs/0c76a17d8903269ec3be3c1f49c46b33564f2e56/pick
                RUN=/mnt/amlfs-04/home/linke/speedtuning-act-vlm-paired-uniform-pick-v1/runs/$SOURCE_COMMIT/pick
                CODE=/osmo/run/workspace/SpeedTuning-act-vlm-paired-uniform-pick
                OUTPUT=/osmo/run/outputs/paired-uniform
                export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl MPLBACKEND=Agg PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 SPEEDTUNING_TORCH_THREADS=2 TOKENIZERS_PARALLELISM=false
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$MANIFEST"
                test -f "$DETECTOR/rgb_proprio_phase_rn18.pt"
                test -f "$TARGETED/COMPLETE.json"
                test -f "$BALANCED/COMPLETE.json"
                test ! -e "$RUN"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q \
                  tests/test_act_vlm_paired_uniform_pick.py \
                  tests/test_act_vlm_balanced35_extension.py \
                  tests/test_staged_vlm_extension.py \
                  tests/test_staged_vlm_frontier.py \
                  tests/test_act_vlm_frontier_server.py \
                  tests/test_one_reset_phase_schedule.py \
                  tests/test_original_act_speed_adapter.py
                mkdir -p "$RUN" "$OUTPUT"
                .venv/bin/python scripts/run_act_vlm_paired_uniform_pick.py \
                  --root "$RUN" --targeted-root "$TARGETED" --balanced-root "$BALANCED" \
                  --source-commit "$SOURCE_COMMIT" --run-manifest "$MANIFEST" \
                  --detector-checkpoint "$DETECTOR/rgb_proprio_phase_rn18.pt" \
                  --detector-source "$DETECTOR/source" --device cuda \
                  2>&1 | tee "$OUTPUT/run.log"
                cp "$RUN/IDENTITY.json" "$RUN/RESULT.json" \
                  "$RUN/COMPLETE.json" "$OUTPUT/"
                echo ACT_VLM_PAIRED_UNIFORM_PICK_COMPLETE source=$SOURCE_COMMIT
