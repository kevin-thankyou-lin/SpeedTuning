version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-vlm-paired-uniform-report-20260824-v2
  timeout: {exec_timeout: 1h, queue_timeout: 12h}
  resources:
    default: {cpu: 2, gpu: 0, memory: 8Gi, platform: ovx-l40, storage: 8Gi}
  groups:
    - name: report-group
      tasks:
        - name: report
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_RESULT=/mnt/amlfs-04/home/linke/speedtuning-act-vlm-paired-uniform-pick-v1/runs/97b0cb2fb8d5e8a13c1e97b719af1ad3abfd7f8e/pick/RESULT.json
                RUN=/mnt/amlfs-04/home/linke/speedtuning-act-vlm-paired-uniform-report-v2/reports/$SOURCE_COMMIT/pick
                CODE=/osmo/run/workspace/SpeedTuning-act-vlm-paired-uniform-report
                OUTPUT=/osmo/run/outputs/report
                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                test -f "$SOURCE_RESULT"
                test ! -e "$RUN"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                mkdir -p "$OUTPUT"
                python scripts/finalize_act_vlm_paired_uniform_report.py \
                  --source-result "$SOURCE_RESULT" --output-root "$RUN" \
                  --source-commit "$SOURCE_COMMIT" \
                  2>&1 | tee "$OUTPUT.log"
                cp "$RUN/RESULT.json" "$RUN/COMPLETE.json" "$OUTPUT/"
                echo ACT_VLM_PAIRED_UNIFORM_REPORT_V2_COMPLETE source=$SOURCE_COMMIT
