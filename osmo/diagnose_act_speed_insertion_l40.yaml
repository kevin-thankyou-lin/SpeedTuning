version: 2
default-values:
  source_commit: REQUIRED_SOURCE_COMMIT
workflow:
  name: speedtuning-act-speed-diagnose-insertion-20260824-v1
  timeout:
    exec_timeout: 2h
    queue_timeout: 4h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 32Gi
  groups:
    - name: diagnose-insertion-group
      tasks:
        - name: diagnose-insertion
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            SOURCE_COMMIT: "{{ source_commit }}"
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                ROOT=/mnt/amlfs-04/home/linke/speedtuning-original-act/speedtuning-original-act-insertion-3pv-wrists-20260824-v1/insertion
                RUN=/mnt/amlfs-04/home/linke/speedtuning-act-speed-benchmark-v1/engineering/diagnose-insertion/$SOURCE_COMMIT
                CODE=/osmo/run/workspace/SpeedTuning-act-speed-diagnose-insertion
                OUTPUT=/osmo/run/outputs/diagnose-insertion

                export MUJOCO_GL=egl
                export PYOPENGL_PLATFORM=egl
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4

                test "$SOURCE_COMMIT" != REQUIRED_SOURCE_COMMIT
                mkdir -p "$RUN" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                .venv/bin/python -m pytest -q tests/test_original_act_speed_adapter.py \
                  2>&1 | tee "$OUTPUT/pytest.log"
                test ! -e "$RUN/diagnostic.json"
                .venv/bin/python scripts/diagnose_act_speed_parity.py \
                  --task insertion --checkpoint-root "$ROOT" --seed 9350040 \
                  --device cuda --output "$RUN/diagnostic.json" \
                  --traces "$RUN/traces.npz" \
                  2>&1 | tee "$OUTPUT/diagnostic.log"
                sha256sum "$RUN/diagnostic.json" "$RUN/traces.npz"
                cp "$RUN/diagnostic.json" "$OUTPUT/"
                echo ACT_SPEED_INSERTION_DIAGNOSTIC_COMPLETE
