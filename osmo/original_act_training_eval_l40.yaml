version: 2
workflow:
  name: speedtuning-original-act-training-eval-20260822-v1
  timeout:
    exec_timeout: 18h
    queue_timeout: 2h
  resources:
    default:
      cpu: 8
      gpu: 1
      memory: 32Gi
      platform: ovx-l40
      storage: 32Gi
  groups:
    - name: evaluate
      tasks:
        - name: pick
          lead: true
          image: &image nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: pick
            RUNTIME_TASK: pick_and_place
            MONITOR_SEED_BASE: "8400000"
          files: &run_file
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=27acda59fa9a8b359910a4a025c0d7697bb3fc73
                TRAINING_EXPERIMENT=speedtuning-original-act-paper-baseline-20260822-v1
                TRAINING_ROOT=/mnt/amlfs-04/home/linke/speedtuning-original-act/$TRAINING_EXPERIMENT/$TASK
                MONITOR_ROOT=$TRAINING_ROOT/training-eval-v1
                OUTPUT=/osmo/run/outputs/$TASK
                CODE=/osmo/run/workspace/SpeedTuning-original-act-eval-$TASK

                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                test ! -e "$MONITOR_ROOT" || { echo "refusing to overwrite $MONITOR_ROOT" >&2; exit 30; }
                mkdir -p "$MONITOR_ROOT" "$OUTPUT"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation
                PYTHON=$CODE/.venv/bin/python
                "$PYTHON" -m scripts.monitor_original_act_training \
                  --task "$RUNTIME_TASK" --training-root "$TRAINING_ROOT" \
                  --output-root "$MONITOR_ROOT" --seed-base "$MONITOR_SEED_BASE" \
                  --episodes 10 --epochs 0 500 1000 1500 1900 \
                  2>&1 | tee "$MONITOR_ROOT/monitor.log"
                test -s "$MONITOR_ROOT/monitor_complete.json"
                cp "$MONITOR_ROOT/progress.json" "$MONITOR_ROOT/monitor_complete.json" "$OUTPUT"/
                echo "ORIGINAL_ACT_TRAINING_EVAL_COMPLETE task=$TASK root=$MONITOR_ROOT"
        - name: tea
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: tea
            RUNTIME_TASK: tea_bag
            MONITOR_SEED_BASE: "8500000"
          files: *run_file
        - name: insertion
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: insertion
            RUNTIME_TASK: insertion
            MONITOR_SEED_BASE: "8600000"
          files: *run_file
