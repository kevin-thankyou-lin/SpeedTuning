version: 2
workflow:
  name: speedtuning-pick-normalization-recovery-20260822-v1
  timeout:
    exec_timeout: 10h
    queue_timeout: 2h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 48Gi
  groups:
    - name: comparison
      tasks:
        - name: scratch-q01-full48
          lead: true
          image: &image nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            VARIANT: scratch-q01-full48
            NORMALIZATION: q01_q99
          files: &run_file
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=6b0f445c14b29ab225ec898fc019ab41d1b5df80
                PREFIX_GENERATION=speedtuning-pick-normalization-recovery-20260822-v1
                SUPERVISED_HORIZON=48
                STEPS=20000
                CHECKPOINT_EVERY=5000
                LEARNING_RATE=1e-4
                INITIALIZE_FROM_BASE=0
                CODE=/osmo/run/workspace/SpeedTuning-$VARIANT
                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                export TOKENIZERS_PARALLELISM=false
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                PYTHON=$CODE/.venv/bin/python
                export SOURCE_COMMIT PYTHON PREFIX_GENERATION SUPERVISED_HORIZON
                export STEPS CHECKPOINT_EVERY LEARNING_RATE INITIALIZE_FROM_BASE
                "$PYTHON" -m pytest -q tests/test_imitation_data.py tests/test_chunked_policies.py tests/test_training_monitor.py
                bash scripts/run_pick_prefix_debug.sh
        - name: scratch-meanstd-full48
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            VARIANT: scratch-meanstd-full48
            NORMALIZATION: mean_std
          files: *run_file
