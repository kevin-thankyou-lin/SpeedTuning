version: 2
workflow:
  name: speedtuning-conditioned-relative-joint-l40-20260821-v2
  timeout:
    exec_timeout: 24h
    queue_timeout: 2h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 64Gi
  groups:
    - name: train
      tasks:
        - name: pick
          lead: true
          image: &image nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: pick
            RUNTIME_TASK: pick_and_place
            EVAL_SEED_BASE: "3100000"
            DATA_SEED_BASE: "4100000"
            FAST_SCHEDULE_ARGS: "--fast-schedule 2,2,2,2 --fast-schedule 1.5,1.5,1.5,1.5 --fast-schedule 4,4,4,4"
          files: &run_file
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=6ae8b3477758f7d0033658c8d5cbb896c5c1c979
                EXPERIMENT=speedtuning-conditioned-relative-joint-20260821-v2
                PERSIST_ROOT=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/$EXPERIMENT
                RUN=$PERSIST_ROOT/$TASK
                OUTPUT=/osmo/run/outputs/$TASK
                CODE=/osmo/run/workspace/SpeedTuning-$TASK

                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4

                test ! -e "$RUN" || { echo "refusing to overwrite $RUN" >&2; exit 30; }
                mkdir -p "$RUN" "$OUTPUT"
                date --iso-8601=seconds | tee "$RUN/started_at.txt"
                nvidia-smi -L | tee "$RUN/gpus.txt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                PYTHON=$CODE/.venv/bin/python
                "$PYTHON" -m pytest -q | tee "$RUN/pytest.log"

                # shellcheck disable=SC2086
                "$PYTHON" -m scripts.collect_conditioned_relative_datasets \
                  --task "$RUNTIME_TASK" --output-root "$RUN/datasets" \
                  --seed-base "$DATA_SEED_BASE" $FAST_SCHEDULE_ARGS \
                  2>&1 | tee "$RUN/collection.log"
                for DATASET in slow_150 mixed_100slow_50fast; do
                  count=$(find "$RUN/datasets/$DATASET/$RUNTIME_TASK" -maxdepth 1 -name 'episode_*.hdf5' | wc -l)
                  test "$count" -eq 150
                done

                for DATASET in slow_150 mixed_100slow_50fast; do
                  for KIND in act diffusion; do
                    MODEL=$RUN/checkpoints/$DATASET/$KIND
                    "$PYTHON" -m scripts.train_relative_imitation \
                      --kind "$KIND" --dataset-dir "$RUN/datasets/$DATASET/$RUNTIME_TASK" \
                      --output-dir "$MODEL" --steps 20000 \
                      --chunk-size 48 --batch-size 16 --seed 0 \
                      2>&1 | tee "$RUN/train-$DATASET-$KIND.log"
                    test -s "$MODEL/best.pt"
                    MODES=0
                    test "$DATASET" = mixed_100slow_50fast && MODES="0 1"
                    for MODE in $MODES; do
                      "$PYTHON" -m scripts.evaluate_relative_imitation \
                        --task "$RUNTIME_TASK" --checkpoint "$MODEL/best.pt" \
                        --output "$RUN/eval-$DATASET-$KIND-mode$MODE.json" --episodes 100 \
                        --seed-base "$EVAL_SEED_BASE" --replan-interval 8 \
                        --speed-condition "$MODE" \
                        2>&1 | tee "$RUN/eval-$DATASET-$KIND-mode$MODE.log"
                    done
                  done
                done

                export RUN TASK SOURCE_COMMIT
                "$PYTHON" - <<'PY'
                import hashlib, json, os
                from pathlib import Path
                run = Path(os.environ["RUN"])
                result = {
                    "task": os.environ["TASK"],
                    "source_commit": os.environ["SOURCE_COMMIT"],
                    "datasets": {
                        "slow_150": {"slow": 150, "fast": 0},
                        "mixed_100slow_50fast": {"slow": 100, "fast": 50},
                    },
                    "condition": "append 0=uniform native 1x or 1=any non-native schedule to normalized 14D qpos; action remains 14D",
                    "relative_action": "target_qpos[t+k] - observations/qpos[t]",
                    "normalization": "train-only pooled q01/q99 clipping to [-1,1]; qpos per joint and delta per chunk offset per joint; 1e-3 minimum span",
                    "normalization_audits": {
                        str(path.parent.relative_to(run / "checkpoints")): json.loads(path.read_text())
                        for path in sorted(run.glob("checkpoints/*/*/normalization_audit.json"))
                    },
                    "evaluations": {
                        path.stem.removeprefix("eval-"): json.loads(path.read_text())
                        for path in sorted(run.glob("eval-*.json"))
                    },
                }
                (run / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
                for path in sorted(run.glob("checkpoints/*/*/best.pt")):
                    digest = hashlib.sha256(path.read_bytes()).hexdigest()
                    with (run / "SHA256SUMS").open("a") as stream:
                        stream.write(f"{digest}  {path.relative_to(run)}\n")
                PY
                date --iso-8601=seconds | tee "$RUN/completed_at.txt"
                cp "$RUN/summary.json" "$RUN/SHA256SUMS" "$RUN/pytest.log" "$OUTPUT"/
                echo "RELATIVE_JOINT_IMITATION_COMPLETE task=$TASK root=$RUN"
                cat "$RUN/summary.json"
        - name: tea
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: tea
            RUNTIME_TASK: tea_bag
            EVAL_SEED_BASE: "3200000"
            DATA_SEED_BASE: "4200000"
            FAST_SCHEDULE_ARGS: "--fast-schedule 2.5,2.5,1.5,1.5 --fast-schedule 2,2,2,2 --fast-schedule 1.5,1.5,1.5,1.5"
          files: *run_file
        - name: insertion
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: insertion
            RUNTIME_TASK: insertion
            EVAL_SEED_BASE: "3300000"
            DATA_SEED_BASE: "4300000"
            FAST_SCHEDULE_ARGS: "--fast-schedule 1.5,2,2,2 --fast-schedule 1.5,1.5,1.5,1.5 --fast-schedule 1,2.5,1.5,1"
          files: *run_file
