version: 2
workflow:
  name: speedtuning-conditioned-relative-joint-meanstd-insertion-final-eval-recovery-20260822-v1
  timeout:
    exec_timeout: 4h
    queue_timeout: 2h
  resources:
    default:
      cpu: 8
      gpu: 1
      memory: 32Gi
      platform: ovx-l40
      storage: 32Gi
  groups:
    - name: recovery
      tasks:
        - name: insertion
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=3ccde06b16629f66ade9d96487945577914f1b58
                RUN=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/speedtuning-conditioned-relative-joint-meanstd-20260822-v1/insertion
                CHECKPOINT=$RUN/checkpoints/mixed_100slow_50fast/diffusion/best.pt
                CHECKPOINT_SHA=5aa908776c8e0c27df1763402322d3d4302667685a15eb09903613083a5591f5
                RECEIPT=$RUN/insertion-final-eval-recovery-v1-receipt.json
                OUTPUT=/osmo/run/outputs/insertion
                CODE=/osmo/run/workspace/SpeedTuning-meanstd-insertion-final-recovery

                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                export TOKENIZERS_PARALLELISM=false

                test -s "$RUN/eval-mixed_100slow_50fast-diffusion-mode0.json"
                test ! -e "$RUN/eval-mixed_100slow_50fast-diffusion-mode1.json"
                test -s "$CHECKPOINT"
                echo "$CHECKPOINT_SHA  $CHECKPOINT" | sha256sum -c -
                test ! -e "$RECEIPT"
                mkdir -p "$OUTPUT"
                export RECEIPT SOURCE_COMMIT CHECKPOINT_SHA
                python - <<'PY'
                import json
                import os
                from pathlib import Path

                Path(os.environ["RECEIPT"]).write_text(json.dumps({
                    "schema": "conditioned-relative-joint-insertion-final-eval-recovery-v1",
                    "source_workflow": "speedtuning-conditioned-relative-joint-meanstd-l40-20260822-v1-1",
                    "incomplete_attempt": {"completed": 38, "successes": 0},
                    "recovery_source_commit": os.environ["SOURCE_COMMIT"],
                    "checkpoint_sha256": os.environ["CHECKPOINT_SHA"],
                    "seed_base": 7300000,
                    "speed_condition": 1,
                }, indent=2) + "\n")
                PY

                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                PYTHON=$CODE/.venv/bin/python
                "$PYTHON" -m pytest -q tests/test_relative_imitation_evaluation.py \
                  2>&1 | tee "$RUN/insertion-final-eval-recovery-v1-pytest.log"
                "$PYTHON" -m scripts.evaluate_relative_imitation \
                  --task insertion --checkpoint "$CHECKPOINT" \
                  --output "$RUN/eval-mixed_100slow_50fast-diffusion-mode1.json" \
                  --episodes 100 --seed-base 7300000 --replan-interval 8 \
                  --speed-condition 1 --resume \
                  2>&1 | tee "$RUN/eval-mixed_100slow_50fast-diffusion-mode1-recovery.log"

                export RUN SOURCE_COMMIT CHECKPOINT_SHA
                "$PYTHON" - <<'PY'
                import hashlib
                import json
                import os
                from pathlib import Path

                run = Path(os.environ["RUN"])
                summary = {
                    "schema": "conditioned-relative-joint-meanstd-v1",
                    "task": "insertion",
                    "source_commit": os.environ["SOURCE_COMMIT"],
                    "input_experiment": "speedtuning-conditioned-relative-joint-20260821-v2",
                    "recovery": {
                        "source_workflow": "speedtuning-conditioned-relative-joint-meanstd-l40-20260822-v1-1",
                        "checkpoint_sha256": os.environ["CHECKPOINT_SHA"],
                        "reason": "original fast-mode final evaluation ended after 38 states without a result",
                    },
                    "datasets": {
                        "slow_150": {"slow": 150, "fast": 0},
                        "mixed_100slow_50fast": {"slow": 100, "fast": 50},
                    },
                    "relative_action": "target_qpos[t+k] - observations/qpos[t]",
                    "normalization": "train-only mean/std z-score; no clipping",
                    "episode_start_probability": 0.25,
                    "evaluations": {
                        path.stem.removeprefix("eval-"): json.loads(path.read_text())
                        for path in sorted(run.glob("eval-*.json"))
                    },
                }
                (run / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
                with (run / "SHA256SUMS").open("w") as stream:
                    for path in sorted(run.glob("checkpoints/*/*/*.pt")):
                        stream.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(run)}\n")
                PY
                date --iso-8601=seconds | tee "$RUN/completed_at.txt"
                cp "$RUN/summary.json" "$RUN/SHA256SUMS" "$RECEIPT" "$OUTPUT"/
                echo "MEANSTD_INSERTION_FINAL_EVAL_RECOVERY_COMPLETE root=$RUN"
