version: 2
workflow:
  name: speedtuning-conditioned-relative-joint-meanstd-l40-20260822-v1
  timeout:
    exec_timeout: 24h
    queue_timeout: 2h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 64Gi
  groups:
    - name: train
      tasks:
        - name: pick
          lead: true
          image: &image nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: pick
            RUNTIME_TASK: pick_and_place
            EVAL_SEED_BASE: "7100000"
          files: &run_file
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=ae3c292f9d024fe84a48af4bd5708f7a377dc724
                INPUT_EXPERIMENT=speedtuning-conditioned-relative-joint-20260821-v2
                EXPERIMENT=speedtuning-conditioned-relative-joint-meanstd-20260822-v1
                INPUT_ROOT=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/$INPUT_EXPERIMENT/$TASK
                PERSIST_ROOT=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/$EXPERIMENT
                RUN=$PERSIST_ROOT/$TASK
                OUTPUT=/osmo/run/outputs/$TASK
                CODE=/osmo/run/workspace/SpeedTuning-meanstd-$TASK

                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                export TOKENIZERS_PARALLELISM=false

                test ! -e "$RUN" || { echo "refusing to overwrite $RUN" >&2; exit 30; }
                mkdir -p "$RUN/checkpoints" "$OUTPUT"
                date --iso-8601=seconds | tee "$RUN/started_at.txt"
                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                PYTHON=$CODE/.venv/bin/python
                "$PYTHON" -m pytest -q \
                  tests/test_imitation_data.py tests/test_chunked_policies.py \
                  tests/test_training_monitor.py | tee "$RUN/pytest.log"

                for DATASET in slow_150 mixed_100slow_50fast; do
                  DATASET_DIR=$INPUT_ROOT/datasets/$DATASET/$RUNTIME_TASK
                  test -d "$DATASET_DIR"
                  count=$(find "$DATASET_DIR" -maxdepth 1 -name 'episode_*.hdf5' | wc -l)
                  test "$count" -eq 150
                  for KIND in act diffusion; do
                    MODEL=$RUN/checkpoints/$DATASET/$KIND
                    "$PYTHON" -m scripts.train_relative_imitation \
                      --kind "$KIND" --dataset-dir "$DATASET_DIR" \
                      --output-dir "$MODEL" --steps 20000 \
                      --chunk-size 48 --batch-size 16 --seed 0 \
                      --normalization mean_std --episode-start-probability 0.25 \
                      --checkpoint-every 5000 \
                      2>&1 | tee "$RUN/train-$DATASET-$KIND.log"
                    test -s "$MODEL/best.pt"
                    test -s "$MODEL/step-20000.pt"
                    MODES=0
                    test "$DATASET" = mixed_100slow_50fast && MODES="0 1"
                    for MODE in $MODES; do
                      "$PYTHON" -m scripts.evaluate_relative_imitation \
                        --task "$RUNTIME_TASK" --checkpoint "$MODEL/best.pt" \
                        --output "$RUN/eval-$DATASET-$KIND-mode$MODE.json" --episodes 100 \
                        --seed-base "$EVAL_SEED_BASE" --replan-interval 8 \
                        --speed-condition "$MODE" \
                        2>&1 | tee "$RUN/eval-$DATASET-$KIND-mode$MODE.log"
                    done
                  done
                done

                export RUN TASK SOURCE_COMMIT INPUT_EXPERIMENT
                "$PYTHON" - <<'PY'
                import hashlib
                import json
                import os
                from pathlib import Path

                run = Path(os.environ["RUN"])
                result = {
                    "schema": "conditioned-relative-joint-meanstd-v1",
                    "task": os.environ["TASK"],
                    "source_commit": os.environ["SOURCE_COMMIT"],
                    "input_experiment": os.environ["INPUT_EXPERIMENT"],
                    "datasets": {
                        "slow_150": {"slow": 150, "fast": 0},
                        "mixed_100slow_50fast": {"slow": 100, "fast": 50},
                    },
                    "relative_action": "target_qpos[t+k] - observations/qpos[t]",
                    "normalization": "train-only mean/std z-score; qpos per joint and delta per chunk offset per joint; no clipping; 1e-3 minimum std",
                    "episode_start_probability": 0.25,
                    "evaluations": {
                        path.stem.removeprefix("eval-"): json.loads(path.read_text())
                        for path in sorted(run.glob("eval-*.json"))
                    },
                }
                (run / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
                with (run / "SHA256SUMS").open("w") as stream:
                    for path in sorted(run.glob("checkpoints/*/*/*.pt")):
                        digest = hashlib.sha256(path.read_bytes()).hexdigest()
                        stream.write(f"{digest}  {path.relative_to(run)}\n")
                PY
                date --iso-8601=seconds | tee "$RUN/completed_at.txt"
                cp "$RUN/summary.json" "$RUN/SHA256SUMS" "$RUN/pytest.log" "$OUTPUT"/
                echo "RELATIVE_JOINT_MEANSTD_COMPLETE task=$TASK root=$RUN"
        - name: tea
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: tea
            RUNTIME_TASK: tea_bag
            EVAL_SEED_BASE: "7200000"
          files: *run_file
        - name: insertion
          image: *image
          command: [bash]
          args: [/tmp/run.sh]
          environment:
            TASK: insertion
            RUNTIME_TASK: insertion
            EVAL_SEED_BASE: "7300000"
          files: *run_file
