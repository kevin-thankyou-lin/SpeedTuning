version: 2
workflow:
  name: speedtuning-conditioned-relative-joint-meanstd-tea-recovery-20260822-v1
  timeout:
    exec_timeout: 12h
    queue_timeout: 2h
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 64Gi
      platform: ovx-l40
      storage: 64Gi
  groups:
    - name: recovery
      tasks:
        - name: tea
          lead: true
          image: nvcr.io/nvidian/gear-n2-eval:2025.08.31@sha256:b4b30df72cb6024a88b005463fc83c4f7da43ece38f8c8ae77e00f1d31d34fea
          command: [bash]
          args: [/tmp/run.sh]
          files:
            - path: /tmp/run.sh
              contents: |-
                set -euo pipefail
                SOURCE_URL=https://github.com/kevin-thankyou-lin/SpeedTuning.git
                SOURCE_COMMIT=3ccde06b16629f66ade9d96487945577914f1b58
                INPUT_EXPERIMENT=speedtuning-conditioned-relative-joint-20260821-v2
                EXPERIMENT=speedtuning-conditioned-relative-joint-meanstd-20260822-v1
                INPUT_ROOT=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/$INPUT_EXPERIMENT/tea
                RUN=/mnt/amlfs-04/home/linke/speedtuning-relative-imitation/$EXPERIMENT/tea
                ACT=$RUN/checkpoints/mixed_100slow_50fast/act/best.pt
                ACT_SHA=dee27eb706f88c5211576d05cfdba89668da4700a0b759a32cc0a1ba20cd7c16
                MODEL=$RUN/checkpoints/mixed_100slow_50fast/diffusion
                DATASET=$INPUT_ROOT/datasets/mixed_100slow_50fast/tea_bag
                RECEIPT=$RUN/tea-recovery-v1-receipt.json
                OUTPUT=/osmo/run/outputs/tea
                CODE=/osmo/run/workspace/SpeedTuning-meanstd-tea-recovery

                export MUJOCO_GL=egl
                export MPLBACKEND=Agg
                export PYTHONUNBUFFERED=1
                export OMP_NUM_THREADS=4
                export MKL_NUM_THREADS=4
                export TOKENIZERS_PARALLELISM=false

                test -s "$RUN/eval-mixed_100slow_50fast-act-mode0.json"
                test ! -e "$RUN/eval-mixed_100slow_50fast-act-mode1.json"
                test -s "$ACT"
                echo "$ACT_SHA  $ACT" | sha256sum -c -
                test ! -e "$MODEL"
                test ! -e "$RECEIPT"
                mkdir -p "$OUTPUT"
                export RECEIPT SOURCE_COMMIT ACT_SHA
                python - <<'PY'
                import json
                import os
                from pathlib import Path

                Path(os.environ["RECEIPT"]).write_text(json.dumps({
                    "schema": "conditioned-relative-joint-tea-recovery-v1",
                    "source_workflow": "speedtuning-conditioned-relative-joint-meanstd-l40-20260822-v1-1",
                    "failure": "dm_control.rl.control.PhysicsError: mjWARN_BADQACC",
                    "failed_seed": 7200045,
                    "completed_before_failure": 45,
                    "successes_before_failure": 36,
                    "recovery_source_commit": os.environ["SOURCE_COMMIT"],
                    "act_checkpoint_sha256": os.environ["ACT_SHA"],
                    "policy": "count physics instability as a failed rollout and continue",
                }, indent=2) + "\n")
                PY

                git clone "$SOURCE_URL" "$CODE"
                git -C "$CODE" checkout --detach "$SOURCE_COMMIT"
                test "$(git -C "$CODE" rev-parse HEAD)" = "$SOURCE_COMMIT"
                cd "$CODE"
                command -v uv >/dev/null || python -m pip install --no-cache-dir uv==0.9.28
                uv python install 3.10
                uv sync --frozen --python 3.10 --extra learned --extra imitation --extra test
                PYTHON=$CODE/.venv/bin/python
                "$PYTHON" -m pytest -q tests/test_relative_imitation_evaluation.py \
                  tests/test_imitation_data.py tests/test_training_monitor.py \
                  2>&1 | tee "$RUN/tea-recovery-v1-pytest.log"

                "$PYTHON" -m scripts.evaluate_relative_imitation \
                  --task tea_bag --checkpoint "$ACT" \
                  --output "$RUN/eval-mixed_100slow_50fast-act-mode1.json" \
                  --episodes 100 --seed-base 7200000 --replan-interval 8 \
                  --speed-condition 1 --resume \
                  2>&1 | tee "$RUN/eval-mixed_100slow_50fast-act-mode1-recovery.log"

                "$PYTHON" -m scripts.train_relative_imitation \
                  --kind diffusion --dataset-dir "$DATASET" --output-dir "$MODEL" \
                  --steps 20000 --chunk-size 48 --batch-size 16 --seed 0 \
                  --normalization mean_std --episode-start-probability 0.25 \
                  --checkpoint-every 5000 \
                  2>&1 | tee "$RUN/train-mixed_100slow_50fast-diffusion.log"
                test -s "$MODEL/best.pt"
                test -s "$MODEL/step-20000.pt"
                for MODE in 0 1; do
                  "$PYTHON" -m scripts.evaluate_relative_imitation \
                    --task tea_bag --checkpoint "$MODEL/best.pt" \
                    --output "$RUN/eval-mixed_100slow_50fast-diffusion-mode$MODE.json" \
                    --episodes 100 --seed-base 7200000 --replan-interval 8 \
                    --speed-condition "$MODE" --resume \
                    2>&1 | tee "$RUN/eval-mixed_100slow_50fast-diffusion-mode$MODE.log"
                done

                export RUN SOURCE_COMMIT ACT_SHA
                "$PYTHON" - <<'PY'
                import hashlib
                import json
                import os
                from pathlib import Path

                run = Path(os.environ["RUN"])
                summary = {
                    "schema": "conditioned-relative-joint-meanstd-v1",
                    "task": "tea",
                    "source_commit": os.environ["SOURCE_COMMIT"],
                    "input_experiment": "speedtuning-conditioned-relative-joint-20260821-v2",
                    "recovery": {
                        "source_workflow": "speedtuning-conditioned-relative-joint-meanstd-l40-20260822-v1-1",
                        "act_checkpoint_sha256": os.environ["ACT_SHA"],
                        "reason": "physics instability aborted the original fast-mode ACT evaluation",
                    },
                    "datasets": {
                        "slow_150": {"slow": 150, "fast": 0},
                        "mixed_100slow_50fast": {"slow": 100, "fast": 50},
                    },
                    "relative_action": "target_qpos[t+k] - observations/qpos[t]",
                    "normalization": "train-only mean/std z-score; no clipping",
                    "episode_start_probability": 0.25,
                    "evaluations": {
                        path.stem.removeprefix("eval-"): json.loads(path.read_text())
                        for path in sorted(run.glob("eval-*.json"))
                    },
                }
                (run / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
                with (run / "SHA256SUMS").open("w") as stream:
                    for path in sorted(run.glob("checkpoints/*/*/*.pt")):
                        stream.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(run)}\n")
                PY
                date --iso-8601=seconds | tee "$RUN/completed_at.txt"
                cp "$RUN/summary.json" "$RUN/SHA256SUMS" "$RECEIPT" "$OUTPUT"/
                echo "RELATIVE_JOINT_MEANSTD_TEA_RECOVERY_COMPLETE root=$RUN"
